services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
  ingest-worker:
    build: .
    environment:
      SPARK_ENABLED: "true"
    command: ["uv", "run", "--no-sync", "python", "scripts/persistent_ingest.py", "--interval", "1800"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me-in-development
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
volumes:
  qdrant_data:
  neo4j_data:

