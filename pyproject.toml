[project]
name = "moroccan-knowledge-crawler"
version = "0.1.0"
description = "A respectful, Moroccan-context web crawler for the knowledge graph pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "neo4j>=5.28,<6",
  "qdrant-client>=1.14,<2",
  "langfuse>=3.0,<4",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "scrapy>=2.13,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
bigdata = ["pyspark>=3.5,<4"]
evaluation = [
  "pandas>=2.2,<3",
  "ragas>=0.3,<1",
  "langchain-community>=0.3,<0.4",
  "langchain-google-vertexai>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep pytest's temporary roots inside the project: the OS temp directory is
# not writable in some sandboxed/CI environments.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
exclude = [".third_party"]

